<!DOCTYPE html>
<html lang="en">
<head>

  <!--
    =========================================================
    TypeRush - Typing Speed Test Application
    =========================================================
    Features:
    - Difficulty levels (Easy / Medium / Hard)
    - Multiple timer modes (30 / 60 / 120 sec)
    - Live WPM, Accuracy, Errors
    - Real-time character highlighting
    - Result screen with performance label
    - Back navigation between screens
    - Best score saved using localStorage
    =========================================================
  -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>TypeRush | Typing Speed Test</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f172a;
      color: white;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .correct {
      color: #22c55e;
    }

    .wrong {
      background: #ef4444;
      color: white;
      border-radius: 4px;
    }

    .current {
      border-bottom: 2px solid #facc15;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    textarea::-webkit-scrollbar {
      display: none;
    }

    .card-transition {
      transition: all 0.3s ease;
    }

  </style>

</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-6xl">

    <!-- ========================================================= -->
    <!-- HOME SCREEN -->
    <!-- ========================================================= -->

    >

        <h1 class="text-5xl md:text-7xl font-bold mb-4">
          TypeRush
        </h1>

        <p class="text-slate-400 text-lg md:text-xl mb-12">
          Improve your typing speed with live feedback and real-time analysis.
        </p>

        <!-- Difficulty -->
        <div class="max-w-md mx-auto mb-6 text-left">

          <label class="block mb-3 text-slate-300 font-medium">
            Select Difficulty
          </label>

          <select
            id="difficultySelect"
            class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 outline-none focus:border-blue-500"
          >
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>

        </div>

        <!-- Timer -->
        <div class="max-w-md mx-auto mb-10 text-left">

          <label class="block mb-3 text-slate-300 font-medium">
            Select Time
          </label>

          <select
            id="timeSelect"
            class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 outline-none focus:border-blue-500"
          >
            <option value="30">30 Seconds</option>
            <option value="60" selected>60 Seconds</option>
            <option value="120">120 Seconds</option>
          </select>

        </div>

        <!-- Start Button -->
        <button
          id="startBtn"
          class="bg-blue-600 hover:bg-blue-700 transition px-10 py-4 rounded-2xl text-lg font-semibold"
        >
          Start Test
        </button>

        <div class="mt-12 text-slate-400 text-lg">

          <span
            id="bestScore"
            class="text-green-400 font-bold text-2xl"
          >
            0
          </span>

        </div>

      </div>

    </section>

    <!-- TEST SCREEN -->
    <!-- ========================================================= -->

    <section
      id="testScreen"

        <div class="bg-slate-800 rounded-2xl p-5 text-center card-transition">

            Time Left
          </p>

          <h2
            id="timer"
            class="text-4xl font-bold text-blue-400"
          >
            60
          </h2>

        </div>

        <div class="bg-slate-800 rounded-2xl p-5 text-center card-transition">

          <p class="text-slate-400 mb-2 text-sm">
            WPM
          </p>

          <h2
            id="wpm"
            class="text-4xl font-bold"
          >
            0
          </h2>

        </div>

        <div class="bg-slate-800 rounded-2xl p-5 text-center card-transition">

          <p class="text-slate-400 mb-2 text-sm">
            Accuracy
          </p>

          <h2
            id="accuracy"
            class="text-4xl font-bold"
          >
            100%
          </h2>

        </div>

        <div class="bg-slate-800 rounded-2xl p-5 text-center card-transition">

            Errors
          </p>

          <h2
            id="errors"
            class="text-4xl font-bold text-red-400"
          >
            0
          </h2>

        </div>

      </div>

      <div
        id="paragraph"
        class="mono bg-slate-950 border border-slate-800 rounded-2xl p-6 text-lg md:text-xl leading-10 min-h-[250px]"

      <textarea
        id="typingInput"
        class="w-full mt-6 bg-slate-800 border border-slate-700 rounded-2xl p-5 outline-none focus:border-blue-500 resize-none h-40 text-lg"

      <div class="flex flex-wrap gap-4 mt-6">

        <button
          id="restartBtn"
          class="bg-red-500 hover:bg-red-600 transition px-6 py-3 rounded-xl font-semibold"

          Restart
        </button>

          class="bg-slate-700 hover:bg-slate-600 transition px-6 py-3 rounded-xl font-semibold"
        >
          Back

    <!-- ========================================================= -->
    <!-- RESULT SCREEN -->
    <!-- ========================================================= -->

    <section
      id="resultScreen"
      class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-8 md:p-12 shadow-2xl text-center"

        Test Complete
      </h2>

      <p class="text-slate-400 text-lg mb-12">
        Your typing performance analysis
      </p>

      <!-- Result Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-10">

        <div class="bg-slate-800 rounded-2xl p-5">

          <p class="text-slate-400 mb-2">
            Final WPM
          </p>

          <h3
            id="finalWPM"
            class="text-4xl font-bold text-green-400"
          >
            0
          </h3>

        </div>

        <div class="bg-slate-800 rounded-2xl p-5">

          <p class="text-slate-400 mb-2">
            Accuracy
          </p>

          <h3
            id="finalAccuracy"
            class="text-4xl font-bold"
          >
            0%
          </h3>

        </div>

        <div class="bg-slate-800 rounded-2xl p-5">

          <p class="text-slate-400 mb-2">
            Characters
          </p>

          <h3
            id="finalCharacters"
            class="text-4xl font-bold"
          >
            0
          </h3>

        </div>

        <div class="bg-slate-800 rounded-2xl p-5">

          <p class="text-slate-400 mb-2">
            Errors
          </p>

          <h3
            id="finalErrors"
            class="text-4xl font-bold text-red-400"
          >
            0
          </h3>

        </div>

      </div>

      <div class="mb-12">

        <p class="text-slate-400 mb-3">
          Performance Level
        </p>

        <h3

      </div>

      <div class="flex flex-wrap justify-center gap-4">

        <button
          id="tryAgainBtn"
          class="bg-blue-600 hover:bg-blue-700 transition px-6 py-3 rounded-xl font-semibold"

          class="bg-red-500 hover:bg-red-600 transition px-6 py-3 rounded-xl font-semibold"
        >
          Back Home

      </div>

    </section>

    // =========================================================
    // APP STATE
    // =========================================================

    const state = {
      started: false,
      timeLeft: 60,
      selectedTime: 60,
      errors: 0,
      totalTyped: 0,
      currentIndex: 0,
      difficulty: "easy",
      intervalId: null,
      paragraphText: ""
    };

    // =========================================================
    // DOM ELEMENTS
    // =========================================================

    const homeScreen = document.querySelector("#homeScreen");
    const testScreen = document.querySelector("#testScreen");
    const resultScreen = document.querySelector("#resultScreen");

    const startBtn = document.querySelector("#startBtn");
    const restartBtn = document.querySelector("#restartBtn");
    const backBtn = document.querySelector("#backBtn");

    const tryAgainBtn = document.querySelector("#tryAgainBtn");
    const newParagraphBtn = document.querySelector("#newParagraphBtn");
    const resultBackBtn = document.querySelector("#resultBackBtn");

    const difficultySelect =
      document.querySelector("#difficultySelect");

    const timeSelect =
      document.querySelector("#timeSelect");

    const paragraphElement =
      document.querySelector("#paragraph");

    const typingInput =
      document.querySelector("#typingInput");

    const timerElement =
      document.querySelector("#timer");

    const wpmElement =
      document.querySelector("#wpm");

    const accuracyElement =
      document.querySelector("#accuracy");

    const errorsElement =
      document.querySelector("#errors");

    const finalWPM =
      document.querySelector("#finalWPM");

    const finalAccuracy =
      document.querySelector("#finalAccuracy");

    const finalCharacters =
      document.querySelector("#finalCharacters");

    const finalErrors =
      document.querySelector("#finalErrors");

    const performanceLabel =
      document.querySelector("#performanceLabel");

    const bestScoreElement =
      document.querySelector("#bestScore");

    // =========================================================
    // LOAD BEST SCORE
    // =========================================================

    function loadBestScore() {

      const bestScore =
        localStorage.getItem("bestWPM") || 0;

      bestScoreElement.textContent = bestScore;
    }

    // =========================================================
    // RANDOM PARAGRAPH
    // =========================================================

    function getRandomParagraph() {

      const difficulty =
        state.difficulty;

      const selectedTime =
        state.selectedTime;

      const paragraphList =
        paragraphs[difficulty][selectedTime];

      const randomIndex =
        Math.floor(Math.random() * paragraphList.length);

      return paragraphList[randomIndex];
    }

    // =========================================================
    // RENDER PARAGRAPH
    // =========================================================

    function renderParagraph() {

      paragraphElement.innerHTML = "";

      state.paragraphText.split("").forEach(character => {

        const span =
          document.createElement("span");

        span.textContent = character;

        paragraphElement.appendChild(span);
      });

      highlightText();
    }

    // =========================================================
    // HIGHLIGHT TYPING
    // =========================================================

    function highlightText() {

      const spans =
        paragraphElement.querySelectorAll("span");

      const typedText =
        typingInput.value;

      state.errors = 0;

      spans.forEach((span, index) => {

        const typedCharacter =
          typedText[index];

        span.classList.remove(
          "correct",
          "wrong",
          "current"
        );

        if (typedCharacter == null) {

          if (index === typedText.length) {

            span.classList.add("current");
          }

        } else if (
          typedCharacter === span.textContent
        ) {

          span.classList.add("correct");

        } else {

          span.classList.add("wrong");

          state.errors++;
        }
      });

      errorsElement.textContent =
        state.errors;
    }

    // =========================================================
    // CALCULATE WPM
    // =========================================================

    function calculateWPM() {

      const timeElapsed =
        (state.selectedTime - state.timeLeft) / 60;

      if (timeElapsed <= 0) return 0;

      const correctCharacters =
        state.totalTyped - state.errors;

      const wordsTyped =
        correctCharacters / 5;

      return Math.max(
        0,
        Math.round(wordsTyped / timeElapsed)
      );
    }

    // =========================================================
    // CALCULATE ACCURACY
    // =========================================================

    function calculateAccuracy() {

      if (state.totalTyped === 0) {

        return 100;
      }

      return Math.round(
        (
          (state.totalTyped - state.errors) /
          state.totalTyped
        ) * 100
      );
    }

    // =========================================================
    // UPDATE LIVE STATS
    // =========================================================

    function updateStats() {

      const currentWPM =
        calculateWPM();

      const currentAccuracy =
        calculateAccuracy();

      wpmElement.textContent =
        currentWPM;

      accuracyElement.textContent =
        currentAccuracy + "%";

      errorsElement.textContent =
        state.errors;

      timerElement.textContent =
        state.timeLeft;

      if (state.timeLeft <= 10) {

        timerElement.classList.remove(
          "text-blue-400"
        );

        timerElement.classList.add(
          "text-red-500"
        );

      } else {

        timerElement.classList.remove(
          "text-red-500"
        );

        timerElement.classList.add(
          "text-blue-400"
        );
      }
    }

    // =========================================================
    // START TIMER
    // =========================================================

    function startTimer() {

      state.intervalId =
        setInterval(() => {

          state.timeLeft--;

          updateStats();

          if (state.timeLeft <= 0) {

            endTest();
          }

        }, 1000);
    }

    // =========================================================
    // START TEST
    // =========================================================

    function startTest() {

      clearInterval(state.intervalId);

      homeScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      testScreen.classList.remove("hidden");

      state.started = false;

      state.selectedTime =
        Number(timeSelect.value);

      state.timeLeft =
        state.selectedTime;

      state.errors = 0;

      state.totalTyped = 0;

      state.currentIndex = 0;

      state.difficulty =
        difficultySelect.value;

      state.paragraphText =
        getRandomParagraph();

      typingInput.value = "";

      renderParagraph();

      updateStats();

      typingInput.focus();
    }

    // =========================================================
    // END TEST
    // =========================================================

    function endTest() {

      clearInterval(state.intervalId);

      typingInput.blur();

      const finalWPMValue =
        calculateWPM();

      const finalAccuracyValue =
        calculateAccuracy();

      finalWPM.textContent =
        finalWPMValue;

      finalAccuracy.textContent =
        finalAccuracyValue + "%";

      finalCharacters.textContent =
        state.totalTyped;

      finalErrors.textContent =
        state.errors;

      performanceLabel.textContent =
        getPerformanceLabel(finalWPMValue);

      saveBestScore(finalWPMValue);

      testScreen.classList.add("hidden");

      resultScreen.classList.remove("hidden");
    }

    // =========================================================
    // PERFORMANCE LABEL
    // =========================================================

    function getPerformanceLabel(wpm) {

      if (wpm < 20) return "Beginner";

      if (wpm < 35) return "Average";

      if (wpm < 50) return "Good";

      if (wpm < 70) return "Excellent";

      return "Pro";
    }

    // =========================================================
    // SAVE BEST SCORE
    // =========================================================

    function saveBestScore(currentWPM) {

      const bestScore =
        Number(localStorage.getItem("bestWPM")) || 0;

      if (currentWPM > bestScore) {

        localStorage.setItem(
          "bestWPM",
          currentWPM
        );

        bestScoreElement.textContent =
          currentWPM;
      }
    }

    // =========================================================
    // RESTART TEST
    // =========================================================

    function restartTest() {

      clearInterval(state.intervalId);

      startTest();
    }

    // =========================================================
    // TYPING INPUT EVENT
    // =========================================================

    typingInput.addEventListener("input", () => {

      if (!state.started) {

        state.started = true;

        startTimer();
      }

      state.totalTyped =
        typingInput.value.length;

      highlightText();

      updateStats();

      if (
        typingInput.value ===
        state.paragraphText
      ) {

        endTest();
      }
    });

    // =========================================================
    // BUTTON EVENTS
    // =========================================================

    startBtn.addEventListener(
      "click",
      startTest
    );

    restartBtn.addEventListener(
      "click",
      restartTest
    );

    backBtn.addEventListener("click", () => {

      clearInterval(state.intervalId);

      testScreen.classList.add("hidden");

      homeScreen.classList.remove("hidden");
    });

    tryAgainBtn.addEventListener("click", () => {

      resultScreen.classList.add("hidden");

      homeScreen.classList.remove("hidden");
    });

    newParagraphBtn.addEventListener(
      "click",
      startTest
    );

    resultBackBtn.addEventListener("click", () => {

      resultScreen.classList.add("hidden");

      homeScreen.classList.remove("hidden");
    });

    // =========================================================
    // INITIAL LOAD
    // =========================================================

    loadBestScore();

  </script>

</body>
</html>
